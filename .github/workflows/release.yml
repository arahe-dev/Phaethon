name: release

# Tag-driven: push a tag like v0.1.0-beta.1 and this produces the artifacts a
# tester downloads. Nothing is published on an untagged commit, so `main` is
# always releasable but never accidentally released.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The same gates as test.yml, repeated here on purpose: a release must
      # never depend on a separate workflow having passed earlier.
      - name: gofmt
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) { Write-Error "not gofmt-clean:`n$unformatted"; exit 1 }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -timeout 10m

      - name: test (race)
        run: go test -race ./... -count=1 -timeout 15m

      - name: build
        shell: pwsh
        env:
          # Phaethon's registered Cloudflare OAuth client. A PKCE public client
          # has no secret, so this is not sensitive; it is a repository variable
          # rather than a secret because a reader seeing it changes nothing.
          PHAETHON_CLOUDFLARE_CLIENT_ID: ${{ vars.PHAETHON_CLOUDFLARE_CLIENT_ID }}
        run: |
          ./scripts/build-all.ps1 -Out dist -Checksums

      - name: build installer
        shell: pwsh
        run: |
          # The raw Windows binary lives inside the archive, not loose in dist:
          # build-all.ps1 stages intermediates outside the output directory so
          # they can be neither published nor hashed. Unpack it for the
          # installer rather than expecting a bare dist/phaethon.exe.
          Expand-Archive -LiteralPath dist/phaethon-windows-amd64.zip -DestinationPath dist/win -Force
          ./installer/build-installer.ps1 -Version "${{ github.ref_name }}" -Binary dist/win/phaethon.exe -Out dist

      # Packaging and hashing both belong to build-all.ps1, which is the single
      # place that knows the asset naming contract the installer depends on.
      # Duplicating the hash step here is how the published checksums and the
      # built archives drift apart.
      - name: verify the release contains what the installer fetches
        shell: pwsh
        run: |
          $required = @('phaethon-linux-amd64.tar.gz','phaethon-linux-arm64.tar.gz','SHA256SUMS.txt')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path dist $name))) {
              throw "release is missing $name, which install.sh downloads"
            }
          }
          Get-Content dist/SHA256SUMS.txt

      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A private repository release: testers are collaborators, not the
          # public, so the artifacts are attached to a draft-then-published
          # release rather than announced.
          gh release create "${{ github.ref_name }}" `
            --title "Phaethon ${{ github.ref_name }}" `
            --notes-file docs/RELEASE-NOTES.md `
            --prerelease `
            dist/*
